<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singing Studio | A Voice in Bloom</title>
<style>
:root{font-family:Georgia,serif;color:#23313a;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#1c2d3b;color:#fff;padding:28px max(22px,calc((100vw - 1100px)/2));}header small{color:#d5b994;letter-spacing:.18em}h1{font-size:clamp(32px,5vw,56px);margin:25px 0 8px;font-weight:normal}header p{color:#c8d0d6}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}.tab{border:1px solid #536270;background:transparent;color:#e6e8e9;border-radius:22px;padding:10px 15px}.tab.active{background:#e7cba6;color:#1b2b37;border-color:#e7cba6}main{max-width:1100px;margin:auto;padding:28px 20px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:30px;font-weight:normal}h3{margin:0 0 10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid #e8e1d8;border-radius:15px;padding:22px;margin-bottom:14px;box-shadow:0 3px 14px #28354408}.number{font-size:38px;color:#344e57}.muted{color:#78818a;font:14px system-ui}.pill{display:inline-block;background:#edf0e9;border-radius:15px;padding:5px 10px;font:12px system-ui;color:#516653}.btn{background:#2d4856;color:white;border:0;border-radius:9px;padding:10px 15px}.btn.secondary{background:#eae4d9;color:#2c414a}.btn.danger{background:#f8eeee;color:#a34a4a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:12px}.entry{border-bottom:1px solid #ece7df;padding:12px 0}.entry:last-child{border:0}input,textarea,select{width:100%;padding:11px;border:1px solid #d9d4ca;border-radius:8px;background:white;color:#24333b}label{display:block;margin:12px 0 5px;font:13px system-ui;color:#5d6870}textarea{min-height:85px}dialog{border:0;border-radius:18px;max-width:500px;width:calc(100% - 30px);padding:25px;box-shadow:0 20px 80px #142b3c55}dialog::backdrop{background:#13232dbb}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter button{border:1px solid #ddd6cb;background:white;border-radius:20px;padding:7px 11px}.filter button.selected{background:#2d4856;color:white}.check{display:flex;align-items:center;gap:10px;padding:9px 0;font-family:system-ui}.check input{width:auto}.timeline{border-left:2px solid #d9b98e;padding-left:20px;margin-left:8px}.timeline .card{position:relative}.timeline .card:before{content:"";position:absolute;left:-29px;top:22px;background:#c5a578;border-radius:50%;height:14px;width:14px}.footer{margin-top:40px;font:12px system-ui;color:#7c858a}.notice{background:#fff3de;border:1px solid #ead5b1;border-radius:12px;padding:14px;font:13px/1.6 system-ui;margin:18px 0}a{color:#365e6a}@media(max-width:600px){.cards{grid-template-columns:1fr}header{padding:24px 20px}main{padding:20px 14px}.card{padding:17px}} 
</style></head><body>
<header><div class="row"><div><small>✦ MY INDEPENDENT CONSERVATORY</small><div style="font-size:22px;margin-top:7px">♫ Singing Studio</div></div><span style="color:#d6bb96">EST. 2025</span></div><h1>A voice in bloom.</h1><p>Een eigen pad door bel canto, opera en klassieke crossover.</p><nav id="nav"></nav></header>
<main><div id="app"></div><div class="footer">Singing Studio · Een persoonlijk artistiek archief · Made to grow with your voice ♡</div></main>
<dialog id="editor"><div class="row"><h3 id="formtitle">Toevoegen</h3><button class="btn secondary" onclick="editor.close()">✕</button></div><form id="form"><div id="fields"></div><p><button class="btn" type="submit">Bewaren</button></p></form></dialog>
<script>
const KEY='singing-studio-v1';
const seed={events:[{id:1,date:'2026-11-28',title:'Tosca · Puccini',type:'Inspiratie',note:'Orpheus Apeldoorn'},{id:2,date:'2026-11-14',title:'Eerste GOOG-optredens',type:'Optreden',note:'Mijn eerste concertweekend'}],songs:[{id:3,title:'Ave Maria',note:'Bach/Gounod',status:'Uitvoeringsklaar'},{id:4,title:'Ombra mai fu',note:'Händel',status:'In studie'},{id:5,title:"Lascia ch’io pianga",note:'Händel',status:'In studie'},{id:6,title:'Nella Fantasia',note:'Morricone',status:'Uitvoeringsklaar'},{id:7,title:'Vaccai · les 1',note:'Nicola Vaccai',status:'In studie'},{id:8,title:'Vaccai · les 7',note:'Nicola Vaccai',status:'In studie'}],lessons:[],milestones:[{id:9,date:'2026-11-14',title:'Mijn eerste GOOG-optredens',note:'Een bijzondere eerste stap op het podium'}],notes:[],practice:{}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}
for(const k of Object.keys(seed))if(!db[k])db[k]=structuredClone(seed[k]);
let tab='home',filter='Alle';
const pages=[['home','Overzicht'],['events','Agenda'],['lessons','Zangles'],['songs','Repertoire'],['practice','Techniek'],['milestones','Mijlpalen']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):'';
const btn=(label,action)=>`<button class="btn secondary" onclick="${action}">${label}</button>`;
function item(x,kind){return `<div class="card"><div class="row"><div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.date?date(x.date):x.note||'')}</div></div>${kind==='songs'?`<span class="pill">${esc(x.status)}</span>`:kind==='events'?`<span class="pill">${esc(x.type)}</span>`:''}</div>${x.date&&x.note?`<p>${esc(x.note)}</p>`:''}<div class="row" style="justify-content:flex-end;margin-top:12px">${kind==='songs'?`<select aria-label="Repertoirestatus" style="max-width:190px" onchange="changeStatus(${x.id},this.value)">${['Op verlanglijst','In studie','Uitvoeringsklaar'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button class="btn secondary" onclick="edit('${kind}',${x.id})">Bewerken</button><button class="btn danger" onclick="removeItem('${kind}',${x.id})">Verwijderen</button></div></div>`}
function render(){
document.getElementById('nav').innerHTML=pages.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');
let out='';
if(tab==='home'){
const next=db.events.filter(e=>e.date>=new Date().toLocaleDateString('sv-SE')).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
out=`<h2>Mijn artistieke thuisbasis ✨</h2><div class="cards"><div class="card"><div class="number">${db.songs.length}</div><div class="muted">Werken in repertoire</div></div><div class="card"><div class="number">${db.events.filter(e=>e.type==='Optreden').length}</div><div class="muted">Optredens</div></div><div class="card"><div class="number">${db.milestones.length}</div><div class="muted">Mijlpalen</div></div></div><h2>Op de lessenaar</h2>${db.songs.filter(s=>s.status==='In studie').slice(0,3).map(s=>item(s,'songs')).join('')||'<p>Nog geen werken in studie.</p>'}<h2>Binnenkort</h2>${next.map(e=>item(e,'events')).join('')||'<p>Je agenda is nog leeg.</p>'}<div class="card"><h3>Studio notes ✍️</h3><textarea id="quicknote" placeholder="Wat heb je vandaag ontdekt over je stem?"></textarea><p><button class="btn" onclick="addNote()">Reflectie bewaren</button></p>${db.notes.slice().reverse().slice(0,3).map(n=>`<div class="entry"><div class="muted">${esc(date(n.date))}</div>${esc(n.title)}</div>`).join('')}</div>`;
}else if(tab==='practice'){
out=`<h2>The Vocal Lab</h2><p class="muted">Vink je oefeningen af. De lijst blijft op dit apparaat bewaard.</p><div class="card"><h3>Oefenroutine</h3>${['Ademsteun & appoggio','Resonantie','Legato','Vibrato','Solfège','Vaccai'].map(t=>`<label class="check"><input type="checkbox" ${db.practice[t]?'checked':''} onchange="togglePractice('${t}',this.checked)"> ${t}</label>`).join('')}<button class="btn secondary" onclick="db.practice={};save();render()">Reset vinkjes</button></div><div class="card"><h3>Technieknotities</h3><p>Legato, klankplaatsing, natuurlijke vibrato en vrije hoogte. Noteer nieuwe ontdekkingen in je zangles of Studio notes.</p></div>`;
}else{
const titles={events:'Mijn agenda',lessons:'Zangles & lesnotities',songs:'Repertoirebibliotheek',milestones:'Mijn mijlpalen'};
out=`<div class="head"><h2>${titles[tab]}</h2><button class="btn" onclick="edit('${tab}')">＋ Toevoegen</button></div>`;
if(tab==='songs')out+=`<div class="filter">${['Alle','Op verlanglijst','In studie','Uitvoeringsklaar'].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div>`;
let entries=[...db[tab]];
if(tab==='songs')entries=entries.filter(s=>filter==='Alle'||s.status===filter);
else entries.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
out+=`<div class="${tab==='milestones'?'timeline':''}">${entries.map(x=>item(x,tab)).join('')||'<p>Nog niets toegevoegd. Tijd voor een eerste notitie!</p>'}</div>`;
}
out+=`<div class="notice"><strong>Privacy & opslag:</strong> gegevens worden alleen in deze browser opgeslagen, niet online gesynchroniseerd. Op een openbare GitHub Pages-site kunnen anderen de site zien, maar niet jouw lokale gegevens. Gebruik de export om een back-up te maken. Zet geen privégegevens in de openbare broncode.</div><div class="row"><button class="btn secondary" onclick="exportData()">↓ Exporteer mijn gegevens</button><label style="margin:0"><span class="btn secondary" style="display:inline-block">↑ Importeer back-up</span><input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div>`;
document.getElementById('app').innerHTML=out;
}
function go(x){tab=x;render();window.scrollTo({top:0,behavior:'smooth'})}
function togglePractice(k,v){db.practice[k]=v;save()}
function changeStatus(id,status){db.songs.find(x=>x.id===id).status=status;save();render()}
function removeItem(kind,id){if(!confirm('Dit item verwijderen?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
function addNote(){const t=document.getElementById('quicknote').value.trim();if(!t)return;db.notes.push({id:Date.now(),title:t,date:new Date().toLocaleDateString('sv-SE')});save();render()}
let editing=null;
function edit(kind,id=null){
editing={kind,id};const x=id?db[kind].find(a=>a.id===id):{};
document.getElementById('formtitle').textContent=id?'Bewerken':'Nieuw toevoegen';
document.getElementById('fields').innerHTML=`<label>Titel</label><input name="title" required value="${esc(x.title||'')}"><label>${kind==='songs'?'Componist / details':'Notities'}</label><textarea name="note">${esc(x.note||'')}</textarea>${kind!=='songs'?`<label>Datum</label><input type="date" name="date" value="${esc(x.date||new Date().toLocaleDateString('sv-SE'))}" required>`:''}${kind==='events'?`<label>Type</label><select name="type">${['Optreden','Repetitie','Zangles','Auditie','Inspiratie'].map(t=>`<option ${x.type===t?'selected':''}>${t}</option>`).join('')}</select>`:''}${kind==='songs'?`<label>Status</label><select name="status">${['Op verlanglijst','In studie','Uitvoeringsklaar'].map(t=>`<option ${x.status===t?'selected':''}>${t}</option>`).join('')}</select>`:''}`;
document.getElementById('editor').showModal();
}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target));const {kind,id}=editing;if(id){Object.assign(db[kind].find(x=>x.id===id),vals)}else{db[kind].push({id:Date.now(),...vals})}save();editor.close();render()};
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='singing-studio-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(e){const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.events)||!Array.isArray(parsed.songs)||!Array.isArray(parsed.lessons)||!Array.isArray(parsed.milestones))throw Error('Ongeldige back-up');if(!confirm('Huidige gegevens vervangen door deze back-up?'))return;db={...structuredClone(seed),...parsed};save();render()}catch(err){alert('Importeren mislukt: '+err.message)}}
render();
</script></body></html>
